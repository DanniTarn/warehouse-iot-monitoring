# The container is single-purpose. Running as root lets Mosquitto read the
# Caddy certificate and key, which are 0600 root inside the caddy_data volume.
user root

# Plain MQTT on 1883 stays for the backend container and for boards that have
# not been reflashed yet.
listener 1883 0.0.0.0
protocol mqtt

# Device-facing TLS. Caddy owns the Let's Encrypt certificate and renews it;
# the certificate is mounted read-only from the caddy_data volume.
listener 8883 0.0.0.0
protocol mqtt
certfile /caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/158.178.229.252.sslip.io/158.178.229.252.sslip.io.crt
keyfile /caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/158.178.229.252.sslip.io/158.178.229.252.sslip.io.key
tls_version tlsv1.2

allow_anonymous false
password_file /mosquitto/config/passwd
persistence true
persistence_location /mosquitto/data/
log_dest stdout
